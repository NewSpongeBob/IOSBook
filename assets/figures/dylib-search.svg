<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="依赖安装名的解析与搜索路径">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.8px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">依赖解析失败，通常错在“安装名展开”这一步</text>

  <rect class="b" x="26" y="46" width="200" height="52" rx="7"/>
  <text class="t" x="40" y="70">安装名</text>
  <text class="s" x="40" y="88">绝对路径或 @rpath 形式</text>

  <rect class="b" x="270" y="46" width="200" height="52" rx="7"/>
  <text class="t" x="284" y="70">展开前缀</text>
  <text class="s" x="284" y="88">@loader_path / @executable_path</text>

  <rect class="b" x="514" y="46" width="216" height="52" rx="7"/>
  <text class="t" x="528" y="70">遍历 LC_RPATH</text>
  <text class="s" x="528" y="88">按声明顺序逐个尝试</text>

  <line x1="226" y1="72" x2="266" y2="72" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="470" y1="72" x2="510" y2="72" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect class="g" x="270" y="132" width="200" height="52" rx="7"/>
  <text class="t" x="284" y="156">找到文件</text>
  <text class="s" x="284" y="174">映射并做符号绑定</text>

  <rect class="y" x="514" y="132" width="216" height="52" rx="7"/>
  <text class="t" x="528" y="156">找不到</text>
  <text class="s" x="528" y="174">报错并列出尝试过的路径</text>

  <line x1="614" y1="98" x2="614" y2="128" stroke="#c26a06" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="510" y1="158" x2="474" y2="158" stroke="#0a8f68" stroke-width="1.3" marker-end="url(#ar)"/>

  <text class="s" x="30" y="228">三条经验：</text>
  <text class="s" x="30" y="250">1）安装名写成构建机绝对路径，分发后必然失败；2）rpath 顺序决定找到哪一份；</text>
  <text class="s" x="30" y="272">3）找不到符号与找不到库是两件事：库在但版本/架构不对，会走符号失败。</text>
  <text class="s" x="30" y="298">排查第一步：otool -L 看安装名，dyld_info -dependents 看实际依赖。</text>

</svg>
