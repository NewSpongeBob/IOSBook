<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="tweak 模块化：多个库、统一入口与进程选择">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L5,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
      .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.8px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="30" y="26">模块化：一个入口、多份能力、按进程分发</text>

  <rect class="b" x="24" y="46" width="130" height="54" rx="7"/>
  <text class="t" x="38" y="70">模块 A</text>
  <text class="s" x="38" y="90">登录相关 hook</text>

  <rect class="b" x="24" y="110" width="130" height="54" rx="7"/>
  <text class="t" x="38" y="134">模块 B</text>
  <text class="s" x="38" y="154">网络请求记录</text>

  <rect class="y" x="186" y="46" width="160" height="118" rx="8"/>
  <text class="t" x="200" y="70">统一入口</text>
  <text class="s" x="200" y="92">构造器只做登记</text>
  <text class="s" x="200" y="112">按配置决定启用谁</text>
  <text class="s" x="200" y="132">按顺序安装 hook</text>

  <rect class="b" x="378" y="46" width="150" height="118" rx="8"/>
  <text class="t" x="392" y="70">注入规则</text>
  <text class="s" x="392" y="92">Bundles / Executables</text>
  <text class="s" x="392" y="112">决定“进哪些进程”</text>
  <text class="s" x="392" y="132">不是决定“启用谁”</text>

  <rect class="g" x="560" y="46" width="176" height="118" rx="8"/>
  <text class="t" x="574" y="70">目标进程</text>
  <text class="s" x="574" y="92">模块按顺序生效</text>
  <text class="s" x="574" y="112">冲突：后装覆盖先装</text>
  <text class="s" x="574" y="132">改配置 → 重启进程</text>

  <line x1="154" y1="73" x2="182" y2="73" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="154" y1="137" x2="182" y2="120" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="346" y1="105" x2="374" y2="105" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="528" y1="105" x2="556" y2="105" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>

  <text class="s" x="24" y="196">两个决定要分开看：<tspan font-weight="600">注入规则</tspan>决定库进不进程，<tspan font-weight="600">模块开关</tspan>决定进了之后装不装 hook。</text>
  <text class="s" x="24" y="218">排查“没生效”先按这个顺序：镜像在不在 → 模块开关 → 类是否注册 → 方法是否被别的模块覆盖。</text>
</svg>
