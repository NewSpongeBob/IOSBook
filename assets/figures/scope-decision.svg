<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="研究范围的判断路径">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">先判断对象归属，再决定能不能动手</text>

  <rect class="b" x="30" y="56" width="200" height="60" rx="8"/>
  <text class="t" x="44" y="80">对象是你构建的吗？</text>
  <text class="s" x="44" y="100">应用、服务、设备</text>

  <rect class="g" x="300" y="56" width="180" height="60" rx="8"/>
  <text class="t" x="314" y="80">可以分析</text>
  <text class="s" x="314" y="100">静态、调试、插桩</text>

  <rect class="y" x="300" y="148" width="180" height="60" rx="8"/>
  <text class="t" x="314" y="172">需要书面授权</text>
  <text class="s" x="314" y="192">否则停止</text>

  <rect class="n" x="540" y="100" width="190" height="60" rx="8"/>
  <text class="t" x="554" y="124">停止并上报</text>
  <text class="s" x="554" y="144">触及他人数据时</text>

  <line x1="230" y1="86" x2="296" y2="86" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <text class="s" x="236" y="78">是</text>
  <line x1="230" y1="170" x2="296" y2="170" stroke="#c26a06" stroke-width="1.4" marker-end="url(#ar)"/>
  <text class="s" x="236" y="162">否</text>
  <line x1="480" y1="178" x2="536" y2="150" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>

  <text class="s" x="30" y="228">三条硬边界：不绕过他人保护、不采集真实用户数据、不扩大影响。</text>

</svg>
