<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="静态调用、Objective-C 消息、Swift 虚表与协议见证四种派发路径">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .lbl{fill:#f4f7fc;stroke:#d7e0ee;stroke-width:1.3}
      .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.3}
      .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.3}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.8px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="20" y="28">四种派发：从左到右，间接层数递增</text>

  <!-- 静态 -->
  <rect class="lbl" x="20" y="48" width="110" height="56" rx="7"/>
  <text class="t" x="75" y="72" text-anchor="middle">静态调用</text>
  <text class="s" x="75" y="90" text-anchor="middle">final / 值类型</text>

  <rect class="b" x="150" y="48" width="180" height="56" rx="7"/>
  <text class="t" x="164" y="72">bl 0x100004a20</text>
  <text class="s" x="164" y="90">目标地址在指令里</text>

  <rect class="b" x="360" y="48" width="160" height="56" rx="7"/>
  <text class="t" x="374" y="72">固定函数体</text>
  <text class="s" x="374" y="90">可内联、可裁剪</text>

  <rect class="g" x="550" y="48" width="180" height="56" rx="7"/>
  <text class="t" x="564" y="72">最易读</text>
  <text class="s" x="564" y="90">调用图可直接画出</text>

  <line x1="330" y1="76" x2="356" y2="76" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="520" y1="76" x2="546" y2="76" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowP)"/>

  <!-- ObjC -->
  <rect class="lbl" x="20" y="132" width="110" height="56" rx="7"/>
  <text class="t" x="75" y="156" text-anchor="middle">ObjC 消息</text>
  <text class="s" x="75" y="174" text-anchor="middle">可被交换</text>

  <rect class="b" x="150" y="132" width="180" height="56" rx="7"/>
  <text class="t" x="164" y="156">x0 = 接收者</text>
  <text class="s" x="164" y="174">x1 = 选择子 → objc_msgSend</text>

  <rect class="b" x="360" y="132" width="160" height="56" rx="7"/>
  <text class="t" x="374" y="156">方法缓存</text>
  <text class="s" x="374" y="174">未命中则查继承链</text>

  <rect class="g" x="550" y="132" width="180" height="56" rx="7"/>
  <text class="t" x="564" y="156">IMP</text>
  <text class="s" x="564" y="174">签名需看方法类型编码</text>

  <line x1="330" y1="160" x2="356" y2="160" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="520" y1="160" x2="546" y2="160" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowP)"/>

  <!-- Swift 虚表 -->
  <rect class="lbl" x="20" y="216" width="110" height="56" rx="7"/>
  <text class="t" x="75" y="240" text-anchor="middle">Swift 类</text>
  <text class="s" x="75" y="258" text-anchor="middle">可继承</text>

  <rect class="b" x="150" y="216" width="180" height="56" rx="7"/>
  <text class="t" x="164" y="240">对象头</text>
  <text class="s" x="164" y="258">指向类型元数据</text>

  <rect class="b" x="360" y="216" width="160" height="56" rx="7"/>
  <text class="t" x="374" y="240">虚表项</text>
  <text class="s" x="374" y="258">按固定偏移取函数指针</text>

  <rect class="g" x="550" y="216" width="180" height="56" rx="7"/>
  <text class="t" x="564" y="240">blr x8</text>
  <text class="s" x="564" y="258">间接调用，静态难追踪</text>

  <line x1="330" y1="244" x2="356" y2="244" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="520" y1="244" x2="546" y2="244" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowP)"/>

  <!-- 协议见证 -->
  <rect class="lbl" x="20" y="300" width="110" height="56" rx="7"/>
  <text class="t" x="75" y="324" text-anchor="middle">协议调用</text>
  <text class="s" x="75" y="342" text-anchor="middle">泛型/存在类型</text>

  <rect class="b" x="150" y="300" width="180" height="56" rx="7"/>
  <text class="t" x="164" y="324">协议值 + 类型</text>
  <text class="s" x="164" y="342">运行期携带具体类型</text>

  <rect class="b" x="360" y="300" width="160" height="56" rx="7"/>
  <text class="t" x="374" y="324">见证表</text>
  <text class="s" x="374" y="342">witness table 按类型生成</text>

  <rect class="g" x="550" y="300" width="180" height="56" rx="7"/>
  <text class="t" x="564" y="324">具体实现</text>
  <text class="s" x="564" y="342">一层额外间接寻址</text>

  <line x1="330" y1="328" x2="356" y2="328" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="520" y1="328" x2="546" y2="328" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowP)"/>

  <rect x="20" y="376" width="720" height="30" rx="7" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="34" y="396">间接层数越多，静态调用图越难画全；调试时改用断点与日志确认“实际走到了哪一条”。</text>
</svg>
