<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="安全审查的六个面">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">六个面，每面至少一个问题</text>

  <rect class="b" x="30" y="52" width="220" height="60" rx="8"/>
  <text class="t" x="44" y="76">身份与授权</text>
  <text class="s" x="44" y="98">服务端是否校验归属</text>

  <rect class="b" x="270" y="52" width="220" height="60" rx="8"/>
  <text class="t" x="284" y="76">数据与隐私</text>
  <text class="s" x="284" y="98">是否会进日志/备份</text>

  <rect class="b" x="510" y="52" width="220" height="60" rx="8"/>
  <text class="t" x="524" y="76">网络</text>
  <text class="s" x="524" y="98">是否有跳过校验</text>

  <rect class="b" x="30" y="126" width="220" height="60" rx="8"/>
  <text class="t" x="44" y="150">平台能力</text>
  <text class="s" x="44" y="172">发布包是否残留调试</text>

  <rect class="b" x="270" y="126" width="220" height="60" rx="8"/>
  <text class="t" x="284" y="150">构建与供应链</text>
  <text class="s" x="284" y="172">依赖是否锁定来源</text>

  <rect class="b" x="510" y="126" width="220" height="60" rx="8"/>
  <text class="t" x="524" y="150">运营与响应</text>
  <text class="s" x="524" y="172">回滚阈值是否就绪</text>

  <text class="s" x="30" y="222">每项都要写出“证据在哪”：规则不是打勾，而是可复核的材料。</text>

</svg>
