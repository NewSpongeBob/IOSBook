<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="attach 与 replace 的执行路径差异">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.8px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">同样改入口，attach 会继续跑原逻辑，replace 不会</text>

  <text class="t" x="30" y="60">attach</text>
  <rect class="b" x="120" y="44" width="150" height="46" rx="7"/>
  <text class="s" x="134" y="72">入口跳转</text>
  <rect class="y" x="320" y="44" width="220" height="46" rx="7"/>
  <text class="s" x="334" y="72">跳板：备份指令 + 回调</text>
  <rect class="b" x="590" y="44" width="140" height="46" rx="7"/>
  <text class="s" x="604" y="72">跳回原函数</text>

  <line x1="270" y1="67" x2="316" y2="67" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="540" y1="67" x2="586" y2="67" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>

  <text class="t" x="30" y="150">replace</text>
  <rect class="b" x="120" y="134" width="150" height="46" rx="7"/>
  <text class="s" x="134" y="162">入口跳转</text>
  <rect class="g" x="320" y="134" width="220" height="46" rx="7"/>
  <text class="s" x="334" y="162">直接执行新实现</text>
  <rect class="n" x="590" y="134" width="140" height="46" rx="7"/>
  <text class="s" x="604" y="162">原逻辑不执行</text>

  <line x1="270" y1="157" x2="316" y2="157" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="540" y1="157" x2="586" y2="157" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>

  <text class="s" x="30" y="222">共同点：都要改代码页、都需要跳板、都能被“实现地址异常 + 私有脏页”观测到。</text>
  <text class="s" x="30" y="244">区别：attach 保留原逻辑，适合观测；replace 完全接管，适合注入测试数据。</text>
  <text class="s" x="30" y="266">两者都必须保留卸载路径，否则恢复不完整会留下半条指令。</text>

</svg>
