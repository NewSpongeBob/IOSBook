<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 沙盒与权限边界 · IOSBook</title><link rel="stylesheet" href="../style.css"></head><body><main class="content"><article class="hero"><header class="chapter-head"><span class="chapter-no">CHAPTER 04</span><h1>沙盒与权限边界</h1><p class="sub">从应用容器、授权能力到系统资源保护</p></header><p class="lead">沙盒是纵深防御的一部分，不等于应用安全的全部。应同时考虑代码签名、权限授权、系统服务校验和服务端访问控制。</p><h2>学习目标</h2><ul><li>理解应用容器与受保护系统资源的隔离目标。</li><li>区分用户授权、应用声明与系统实际��行的策略。</li><li>建立最小权限和数据分级的设计思路。</li></ul><h2>防御检查</h2><p>在自有应用中检查敏感数据是否只存放于必要位置、权限请求是否最小化、授权撤销后功能是否正确降级，并确认服务端不会仅依赖客户端声明。</p><nav class="pager"><a href="./03-dyld.html">← 上一章</a><a href="../part/01-foundation.html">第一部目录</a><a href="./05-signature.html">下一章：代码签名 →</a></nav></article></main></body></html>
