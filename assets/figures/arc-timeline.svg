<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="ARC 引用计数与对象生命周期">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">引用计数决定释放点，编译期插入 retain/release</text>

  <line x1="50" y1="120" x2="710" y2="120" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>

  <circle cx="110" cy="120" r="7" fill="#2563eb"/>
  <text class="t" x="110" y="100" text-anchor="middle">alloc</text>
  <text class="s" x="110" y="146" text-anchor="middle">ref = 1</text>

  <circle cx="270" cy="120" r="7" fill="#2563eb"/>
  <text class="t" x="270" y="100" text-anchor="middle">strong 赋值</text>
  <text class="s" x="270" y="146" text-anchor="middle">ref = 2</text>

  <circle cx="430" cy="120" r="7" fill="#2563eb"/>
  <text class="t" x="430" y="100" text-anchor="middle">离开作用域</text>
  <text class="s" x="430" y="146" text-anchor="middle">ref = 1</text>

  <circle cx="590" cy="120" r="7" fill="#2563eb"/>
  <text class="t" x="590" y="100" text-anchor="middle">最后一个释放</text>
  <text class="s" x="590" y="146" text-anchor="middle">ref = 0</text>

  <text class="t" x="660" y="100" text-anchor="middle">deinit</text>
  <text class="s" x="660" y="146" text-anchor="middle">之后才 free</text>

  <text class="s" x="30" y="196">环：A 强持有 B，B 强持有 A，ref 永远不归零——用 weak/unowned 打断，或重构所有权。</text>
  <text class="s" x="30" y="218">资源（文件、会话、任务）有独立关闭协议，不应只等 deinit。</text>
  <text class="s" x="30" y="240">优化会做 retain/release 消除，反汇编里看不到调用是正常的。</text>

</svg>
