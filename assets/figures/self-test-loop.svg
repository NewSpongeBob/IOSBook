<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="自测的使用方式">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">先答，后对照，再补实验</text>

  <rect class="b" x="30" y="56" width="190" height="62" rx="8"/>
  <text class="t" x="44" y="82">用自己的话作答</text>
  <text class="s" x="44" y="102">三句以内</text>

  <rect class="b" x="250" y="56" width="190" height="62" rx="8"/>
  <text class="t" x="264" y="82">对照要点</text>
  <text class="s" x="264" y="102">找缺失的条件</text>

  <rect class="b" x="470" y="56" width="190" height="62" rx="8"/>
  <text class="t" x="484" y="82">回到实验</text>
  <text class="s" x="484" y="102">用一次观察补齐</text>

  <line x1="220" y1="87" x2="246" y2="87" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="440" y1="87" x2="466" y2="87" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>

  <text class="s" x="30" y="164">合格标准：能说出“为什么”和“在什么条件下成立”，而不只是复述术语。</text>
  <text class="s" x="30" y="186">答不出的题，往往对应一个没做过的实验；把它记进待补清单。</text>
  <text class="s" x="30" y="208">直接读答案记不住机制，也发现不了自己的误区。</text>

</svg>
