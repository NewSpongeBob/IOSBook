<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Swift 派发方式与 ABI">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">是否有运行时类型信息，决定走哪条派发路径</text>

  <line x1="380" y1="52" x2="380" y2="244" stroke="#c9d6ea" stroke-width="1.4"/>
  <line x1="60" y1="148" x2="700" y2="148" stroke="#c9d6ea" stroke-width="1.4"/>

  <rect class="g" x="70" y="60" width="290" height="76" rx="8"/>
  <text class="t" x="84" y="84">静态派发</text>
  <text class="s" x="84" y="106">final、值类型、全局函数</text>
  <text class="s" x="84" y="124">可直接内联，最小开销</text>

  <rect class="b" x="400" y="60" width="290" height="76" rx="8"/>
  <text class="t" x="414" y="84">类虚表</text>
  <text class="s" x="414" y="106">可继承类方法</text>
  <text class="s" x="414" y="124">按类型取函数指针后 blr</text>

  <rect class="b" x="70" y="160" width="290" height="76" rx="8"/>
  <text class="t" x="84" y="184">协议见证表</text>
  <text class="s" x="84" y="206">通过协议类型调用</text>
  <text class="s" x="84" y="224">按具体类型查见证表</text>

  <rect class="y" x="400" y="160" width="290" height="76" rx="8"/>
  <text class="t" x="414" y="184">Objective-C 消息</text>
  <text class="s" x="414" y="206">@objc / dynamic 暴露</text>
  <text class="s" x="414" y="224">可交换、可转发、可按名字 hook</text>

  <text class="s" x="60" y="272">反汇编里看到 blr 不一定是消息发送：先看目标是从对象头取的，还是从选择子查的。</text>

</svg>
