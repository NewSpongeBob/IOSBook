<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="自动化四步">
<defs><style>
  .p{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .q{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.5px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .n{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#fff;font-weight:700}
</style></defs>
<text class="h" x="30" y="26">自动化四步：写、跑、等、取</text>
<rect class="p" x="24" y="44" width="168" height="104" rx="9"/>
<circle cx="44" cy="64" r="10" fill="#2563eb"/><text class="n" x="44" y="68" text-anchor="middle">1</text>
<text class="t" x="60" y="68">写用例</text>
<text class="s" x="38" y="92">按标识定位</text>
<text class="s" x="38" y="114">一个用例只做一件事</text>
<rect class="p" x="208" y="44" width="168" height="104" rx="9"/>
<circle cx="228" cy="64" r="10" fill="#2563eb"/><text class="n" x="228" y="68" text-anchor="middle">2</text>
<text class="t" x="244" y="68">启动</text>
<text class="s" x="222" y="92">launch 后等首屏</text>
<text class="s" x="222" y="114">不要立即点</text>
<rect class="q" x="392" y="44" width="168" height="104" rx="9"/>
<circle cx="412" cy="64" r="10" fill="#c26a06"/><text class="n" x="412" y="68" text-anchor="middle">3</text>
<text class="t" x="428" y="68">操作+等待</text>
<text class="s" x="406" y="92">等可点击</text>
<text class="s" x="406" y="114">不要用固定 sleep</text>
<rect class="g" x="576" y="44" width="168" height="104" rx="9"/>
<circle cx="596" cy="64" r="10" fill="#0a8f68"/><text class="n" x="596" y="68" text-anchor="middle">4</text>
<text class="t" x="612" y="68">取结果</text>
<text class="s" x="590" y="92">断言 + 截图</text>
<text class="s" x="590" y="114">失败留证据</text>
<rect x="24" y="168" width="712" height="34" rx="6" fill="#fff9ec" stroke="#f0d9a8"/>
<text class="s" x="38" y="190">自动化负责“每次都走到同一个地方”，观测仍靠断点与日志。</text>
</svg>
