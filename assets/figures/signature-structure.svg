<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="代码签名的摘要树与证书签名关系">
  <defs>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .pg{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
      .cd{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .cs{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:13px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;fill:#475467}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="30" y="28">被签名的内容</text>
  <text class="h" x="286" y="28">CodeDirectory（摘要与声明）</text>
  <text class="h" x="556" y="28">签名与信任链</text>

  <rect class="pg" x="30" y="46" width="170" height="42" rx="7"/>
  <text class="t" x="44" y="72" font-size="12.5">可执行代码页</text>

  <rect class="pg" x="30" y="96" width="170" height="42" rx="7"/>
  <text class="t" x="44" y="122" font-size="12.5">Info.plist</text>

  <rect class="pg" x="30" y="146" width="170" height="42" rx="7"/>
  <text class="t" x="44" y="172" font-size="12.5">资源与特殊槽位</text>

  <rect class="pg" x="30" y="196" width="170" height="42" rx="7"/>
  <text class="t" x="44" y="222" font-size="12.5">entitlements</text>

  <rect class="cd" x="286" y="46" width="204" height="192" rx="9"/>
  <text class="s" x="300" y="70">标识：bundle id / team</text>
  <line x1="300" y1="80" x2="476" y2="80" stroke="#dbe3ee"/>
  <text class="s" x="300" y="100">页哈希表（按块）</text>
  <line x1="300" y1="110" x2="476" y2="110" stroke="#dbe3ee"/>
  <text class="s" x="300" y="130">能力声明（entitlement）</text>
  <line x1="300" y1="140" x2="476" y2="140" stroke="#dbe3ee"/>
  <text class="s" x="300" y="160">签发要求（requirements）</text>
  <line x1="300" y1="170" x2="476" y2="170" stroke="#dbe3ee"/>
  <text class="s" x="300" y="190">特殊槽位摘要</text>
  <line x1="300" y1="200" x2="476" y2="200" stroke="#dbe3ee"/>
  <text class="s" x="300" y="220">整体哈希 → cdhash</text>

  <rect class="cs" x="556" y="56" width="176" height="80" rx="9"/>
  <text class="t" x="572" y="82" font-size="12.5">CMS 签名</text>
  <text class="s" x="572" y="104">对 CodeDirectory 签名</text>
  <text class="s" x="572" y="122">身份 + 时间 + 算法</text>

  <rect class="cs" x="556" y="158" width="176" height="80" rx="9"/>
  <text class="t" x="572" y="184" font-size="12.5">证书链</text>
  <text class="s" x="572" y="206">叶证书 → 中间 → 根</text>
  <text class="s" x="572" y="224">由系统信任评估</text>

  <line x1="200" y1="67" x2="282" y2="90" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowS)"/>
  <line x1="200" y1="117" x2="282" y2="120" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowS)"/>
  <line x1="200" y1="167" x2="282" y2="160" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowS)"/>
  <line x1="200" y1="217" x2="282" y2="190" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowS)"/>

  <line x1="490" y1="100" x2="552" y2="96" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowS)"/>
  <line x1="564" y1="140" x2="564" y2="154" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrowS)"/>

  <rect x="30" y="272" width="702" height="40" rx="8" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="46" y="297">改动任意参与签名的字节都会改变摘要，校验失败；但签名只证明“来源与内容未变”，不证明行为安全。</text>
</svg>
