<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="控制流平坦化后的分派循环结构">
  <defs>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .c{fill:#f4f0fd;stroke:#d6c9f2;stroke-width:1.3}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="30" y="30">平坦化后的函数：一个循环，按状态跳到不同的块</text>

  <rect class="b" x="24" y="128" width="104" height="50" rx="8"/>
  <text class="t" x="76" y="158" text-anchor="middle">入口</text>

  <rect x="186" y="52" width="384" height="228" rx="12" fill="#fbfcfe" stroke="#c9d6ea" stroke-dasharray="6 4"/>
  <text class="s" x="202" y="74">while (true) 分派循环</text>

  <rect class="b" x="214" y="86" width="328" height="42" rx="7"/>
  <text class="t" x="378" y="112" text-anchor="middle">switch (state)：跳到对应状态块</text>

  <rect class="c" x="214" y="146" width="98" height="40" rx="7"/>
  <text class="t" x="263" y="172" text-anchor="middle" font-size="12">块 A</text>

  <rect class="c" x="326" y="146" width="98" height="40" rx="7"/>
  <text class="t" x="375" y="172" text-anchor="middle" font-size="12">块 B</text>

  <rect class="c" x="438" y="146" width="104" height="40" rx="7"/>
  <text class="t" x="490" y="172" text-anchor="middle" font-size="12">块 C</text>

  <text class="s" x="214" y="216">每个块末尾更新 state，然后回到分派器（循环）</text>
  <text class="s" x="214" y="238">真实跳转被藏进状态变量，静态难以还原顺序</text>

  <line x1="128" y1="153" x2="182" y2="153" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowO)"/>


  <rect class="b" x="626" y="84" width="108" height="48" rx="8"/>
  <text class="t" x="680" y="113" text-anchor="middle">退出</text>

  <line x1="542" y1="108" x2="622" y2="108" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowO)"/>
  <text class="s" x="548" y="100">条件满足</text>

  <rect x="24" y="288" width="710" height="28" rx="7" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="38" y="307">识别方法：先找这个循环与状态变量，再把每个状态块当作原始基本块，重建跳转关系。</text>
</svg>
