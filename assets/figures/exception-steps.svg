<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="异常到崩溃报告的五步分帧">
  <defs>
    <style>
      .p{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .q{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
      .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.5px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
      .n{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#fff;font-weight:700}
    </style>
  </defs>

  <text class="h" x="30" y="26">异常五步：从一条指令到一份报告</text>

  <rect class="p" x="24" y="44" width="136" height="112" rx="9"/>
  <circle cx="44" cy="64" r="10" fill="#2563eb"/><text class="n" x="44" y="68" text-anchor="middle">1</text>
  <text class="t" x="60" y="68">指令触发</text>
  <text class="s" x="38" y="92">访存、权限、断点</text>
  <text class="s" x="38" y="112">同步异常</text>
  <text class="s" x="38" y="136">pc 指向该指令</text>

  <rect class="p" x="176" y="44" width="136" height="112" rx="9"/>
  <circle cx="196" cy="64" r="10" fill="#2563eb"/><text class="n" x="196" y="68" text-anchor="middle">2</text>
  <text class="t" x="212" y="68">进异常向量</text>
  <text class="s" x="190" y="92">CPU 切到内核</text>
  <text class="s" x="190" y="112">保存现场</text>
  <text class="s" x="190" y="136">判断异常类型</text>

  <rect class="q" x="328" y="44" width="136" height="112" rx="9"/>
  <circle cx="348" cy="64" r="10" fill="#c26a06"/><text class="n" x="348" y="68" text-anchor="middle">3</text>
  <text class="t" x="364" y="68">查异常端口</text>
  <text class="s" x="342" y="92">任务/线程是否认领</text>
  <text class="s" x="342" y="112">认领 → 交给调试器</text>
  <text class="s" x="342" y="136">未认领 → 继续</text>

  <rect class="q" x="480" y="44" width="136" height="112" rx="9"/>
  <circle cx="500" cy="64" r="10" fill="#c26a06"/><text class="n" x="500" y="68" text-anchor="middle">4</text>
  <text class="t" x="516" y="68">转成信号</text>
  <text class="s" x="494" y="92">SIGSEGV / SIGBUS</text>
  <text class="s" x="494" y="112">SIGILL / SIGTRAP</text>
  <text class="s" x="494" y="136">无处理者 → 终止</text>

  <rect class="g" x="632" y="44" width="104" height="112" rx="9"/>
  <circle cx="652" cy="64" r="10" fill="#0a8f68"/><text class="n" x="652" y="68" text-anchor="middle">5</text>
  <text class="t" x="668" y="68">写报告</text>
  <text class="s" x="646" y="92">类型 + 子类型</text>
  <text class="s" x="646" y="112">触发线程</text>

  <text class="s" x="24" y="190">第 3 步是分叉点：端口被认领时，异常不会变成信号，也就不会产生普通崩溃报告。</text>
  <text class="s" x="24" y="214">所以“明明崩了却没有报告”并不矛盾——收集器把异常接走了。</text>
  <text class="s" x="24" y="238">报告里的异常编号来自第 1–3 步，信号编号来自第 4 步，两者要分开读。</text>

  <rect x="24" y="252" width="712" height="34" rx="6" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="38" y="274">排查顺序：先看异常类型与子类型，再看触发线程，最后才看调用栈。</text>
</svg>
