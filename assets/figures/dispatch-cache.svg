<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="消息发送的缓存与继承链查找">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">一次消息发送：先查缓存，再查继承链，最后才转发</text>

  <rect class="b" x="26" y="52" width="150" height="60" rx="8"/>
  <text class="t" x="40" y="76">调用点</text>
  <text class="s" x="40" y="96">x0=接收者 x1=选择子</text>

  <rect class="b" x="230" y="52" width="150" height="60" rx="8"/>
  <text class="t" x="244" y="76">方法缓存</text>
  <text class="s" x="244" y="96">命中即调用</text>

  <rect class="b" x="434" y="52" width="150" height="60" rx="8"/>
  <text class="t" x="448" y="76">类方法列表</text>
  <text class="s" x="448" y="96">未命中继续上溯</text>

  <rect class="b" x="638" y="52" width="96" height="60" rx="8"/>
  <text class="t" x="650" y="76">父类链</text>

  <line x1="176" y1="82" x2="226" y2="82" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="380" y1="82" x2="430" y2="82" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="584" y1="82" x2="634" y2="82" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect class="y" x="230" y="150" width="200" height="56" rx="8"/>
  <text class="t" x="244" y="174">动态解析 / 转发</text>
  <text class="s" x="244" y="194">都失败才抛异常</text>

  <line x1="509" y1="112" x2="380" y2="146" stroke="#c26a06" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ar)"/>

  <text class="s" x="30" y="248">缓存按类共享，不在调用点；因此交换实现后，所有调用点都会走新实现。</text>
  <text class="s" x="30" y="270">首次调用较慢（未建缓存），之后命中；这也是“偶发慢”常被误判为性能问题的原因。</text>

</svg>
