<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="进程内的资源归属与线程">
  <defs>
    <marker id="arrowPr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .box{fill:none;stroke:#c9d6ea;stroke-width:1.6;stroke-dasharray:6 4}
      .chip{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.3}
      .th{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.3}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="30" y="26">一个进程：共享的资源 + 独立的执行流</text>

  <rect class="box" x="30" y="44" width="480" height="200" rx="12"/>
  <text class="s" x="44" y="66">进程（资源与权限边界）</text>

  <rect class="chip" x="46" y="78" width="130" height="46" rx="7"/>
  <text class="t" x="58" y="100" font-size="12">地址空间</text>
  <text class="s" x="58" y="116">代码、堆、库映射</text>

  <rect class="chip" x="190" y="78" width="130" height="46" rx="7"/>
  <text class="t" x="202" y="100" font-size="12">文件描述符</text>
  <text class="s" x="202" y="116">进程内共享</text>

  <rect class="chip" x="334" y="78" width="160" height="46" rx="7"/>
  <text class="t" x="346" y="100" font-size="12">凭据与沙盒</text>
  <text class="s" x="346" y="116">线程无法自行提升</text>

  <rect class="chip" x="46" y="136" width="200" height="46" rx="7"/>
  <text class="t" x="58" y="158" font-size="12">端口命名空间</text>
  <text class="s" x="58" y="174">跨进程需权能</text>

  <rect class="th" x="264" y="136" width="230" height="46" rx="7"/>
  <text class="t" x="276" y="158" font-size="12">线程 1：栈 + 寄存器</text>
  <text class="s" x="276" y="174">独立上下文</text>

  <rect class="th" x="46" y="192" width="200" height="40" rx="7"/>
  <text class="t" x="58" y="217" font-size="12">线程 2：栈 + 寄存器</text>

  <rect class="th" x="264" y="192" width="230" height="40" rx="7"/>
  <text class="t" x="276" y="217" font-size="12">线程 N：栈 + 寄存器</text>

  <rect class="chip" x="540" y="62" width="190" height="70" rx="8"/>
  <text class="t" x="554" y="86" font-size="12">队列（组织方式）</text>
  <text class="s" x="554" y="106">串行：顺序执行</text>
  <text class="s" x="554" y="122">并发：同时执行</text>

  <rect class="chip" x="540" y="152" width="190" height="70" rx="8"/>
  <text class="t" x="554" y="176" font-size="12">QoS（调度意图）</text>
  <text class="s" x="554" y="196">interactive / utility</text>
  <text class="s" x="554" y="212">影响调度与能耗</text>

  <line x1="540" y1="96" x2="514" y2="96" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrowPr)"/>
  <line x1="540" y1="186" x2="514" y2="186" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrowPr)"/>

  <text class="s" x="30" y="278">线程共享内存 → 共享可变状态必须同步；线程不隔离权限 → 换线程不会降低风险。</text>
  <text class="s" x="30" y="300">队列只是提交任务的抽象，既不等于线程，也不保证固定线程。</text>
</svg>
