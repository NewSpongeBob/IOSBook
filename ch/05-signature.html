<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>05 代码签名与完整性 · IOSBook</title><link rel="stylesheet" href="../style.css"></head><body><main class="content"><article class="hero"><header class="chapter-head"><span class="chapter-no">CHAPTER 05</span><h1>代码签名与完整性</h1><p class="sub">签名身份、代码完整性与平台信任策略</p></header><p class="lead">代码签名把代码内容与签名身份关联起来，是平台信任体系的一部分；它不是对应用逻辑正确性或服务端安全性的证明。</p><h2>学习目标</h2><ul><li>区分签名身份、签名内容完整性和运行时安全策略。</li><li>理解证书、配置文件与平台验证在发布流程中的角色。</li><li>在自有构建产物上验证签名并记录构建环境。</li></ul><h2>防御视角</h2><p>将签名验证纳入发布流水线；保护证书与构建凭据；对依赖、构建产物和发布版本建立可追溯记录。签名通过不代表应用逻辑无需安全审查。</p><nav class="pager"><a href="./04-sandbox.html">← 上一章</a><a href="../part/01-foundation.html">第一部目录</a><a href="../part/02-runtime.html">第二部目录 →</a></nav></article></main></body></html>
