      <h1>01 iOS 启动链与 Boot 流程</h1>
      <p>iOS 的启动链可以理解为一条从硬件信任到用户空间可执行环境的验证与初始化过程。它涉及 BootROM、iBoot、Kernel、launchd，以及 app 的最终加载。</p>
      <p><b>关键主线：</b>Trusted boot → kernel init → userland launch → app entry.</p>
      <p><b>工程重点：</b>认识启动环节中的信任、权限、隔离和加载顺序。</p>
