<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="应用包、数据容器、App Group 容器与钥匙串的关系">
  <defs>
    <style>
      .zone{fill:#fbfcfe;stroke:#c9d6ea;stroke-width:1.4;stroke-dasharray:5 4}
      .box{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .ro{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.4}
      .grp{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
      .kc{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:13.5px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="30" y="26">文件系统内的应用沙盒</text>
  <rect class="zone" x="30" y="40" width="380" height="320" rx="12"/>

  <rect class="ro" x="52" y="58" width="336" height="58" rx="8"/>
  <text class="t" x="68" y="80">应用包（只读）</text>
  <text class="s" x="68" y="102">可执行文件、资源；运行期不可写</text>

  <rect class="box" x="52" y="128" width="336" height="212" rx="8"/>
  <text class="t" x="68" y="150">数据容器（可写）</text>

  <rect x="68" y="162" width="304" height="42" rx="6" fill="#fff" stroke="#d7dee9"/>
  <text class="t" x="82" y="188" font-size="12.5">Documents</text>
  <text class="s" x="200" y="188">用户数据，默认参与备份</text>

  <rect x="68" y="212" width="304" height="42" rx="6" fill="#fff" stroke="#d7dee9"/>
  <text class="t" x="82" y="238" font-size="12.5">Library</text>
  <text class="s" x="160" y="238">Application Support / Caches（可被清理）</text>

  <rect x="68" y="262" width="304" height="42" rx="6" fill="#fff" stroke="#d7dee9"/>
  <text class="t" x="82" y="288" font-size="12.5">tmp</text>
  <text class="s" x="150" y="288">临时文件，不保证长期保留</text>

  <rect class="grp" x="450" y="56" width="280" height="118" rx="10"/>
  <text class="t" x="468" y="80">App Group 容器</text>
  <text class="s" x="468" y="104">主应用与扩展共享同一目录，</text>
  <text class="s" x="468" y="124">前提是签名里含对应 group 能力。</text>
  <text class="s" x="468" y="150">不是“公共目录”，其他应用仍不可见。</text>

  <rect class="kc" x="450" y="196" width="280" height="118" rx="10"/>
  <text class="t" x="468" y="220">钥匙串</text>
  <text class="s" x="468" y="244">按访问组隔离，与文件系统分离；</text>
  <text class="s" x="468" y="264">可访问性决定锁屏时能否读取。</text>
  <text class="s" x="468" y="288">卸载重装后条目可能仍然存在。</text>

  <rect x="450" y="338" width="280" height="38" rx="8" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="466" y="362">三条边界分别由沙盒、签名、用户授权决定。</text>
</svg>
