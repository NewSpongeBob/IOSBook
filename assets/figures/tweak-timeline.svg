<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="tweak 在进程生命周期中的注入与生效窗口">
  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
      .g{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;fill:#0a8f68}
    </style>
  </defs>

  <text class="h" x="30" y="30">进程生命周期与 tweak 的生效窗口</text>

  <rect x="296" y="86" width="382" height="118" rx="10" fill="#effaf5" stroke="#a9dcc9" stroke-dasharray="5 4"/>
  <text class="g" x="306" y="106">可观测窗口：构造函数之后，进程结束之前</text>

  <line x1="50" y1="150" x2="710" y2="150" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowT)"/>

  <circle cx="90" cy="150" r="7" fill="#2563eb"/>
  <text class="t" x="90" y="132" text-anchor="middle">启动</text>

  <circle cx="210" cy="150" r="7" fill="#2563eb"/>
  <text class="t" x="210" y="132" text-anchor="middle">注入</text>

  <circle cx="330" cy="150" r="7" fill="#2563eb"/>
  <text class="t" x="330" y="132" text-anchor="middle">构造函数</text>

  <circle cx="450" cy="150" r="7" fill="#2563eb"/>
  <text class="t" x="450" y="132" text-anchor="middle">main</text>

  <circle cx="570" cy="150" r="7" fill="#2563eb"/>
  <text class="t" x="570" y="132" text-anchor="middle">事件回调</text>

  <circle cx="670" cy="150" r="7" fill="#2563eb"/>
  <text class="t" x="670" y="132" text-anchor="middle">退出</text>

  <text class="s" x="90" y="176" text-anchor="middle">未加载代码</text>
  <text class="s" x="210" y="176" text-anchor="middle">按配置加载动态库</text>
  <text class="s" x="330" y="176" text-anchor="middle">早于 main，类多未注册</text>
  <text class="s" x="450" y="176" text-anchor="middle">应用对象建立</text>
  <text class="s" x="570" y="176" text-anchor="middle">业务路径可达</text>
  <text class="s" x="670" y="176" text-anchor="middle">无卸载保证</text>

  <rect x="30" y="234" width="700" height="46" rx="8" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="46" y="256">“改了配置要重启应用”不是习惯问题：配置在每个进程启动时读取，运行中的进程不会自动重载。</text>
  <text class="s" x="46" y="272">构造函数越早，能碰的东西越少；想操作业务对象，必须等到类注册或界面出现之后。</text>
</svg>
