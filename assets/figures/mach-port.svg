<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Mach 端口的发送权与接收权，以及无权能的任务被拒绝">
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .p{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.5;stroke-dasharray:6 4}
      .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:13.5px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;fill:#68727f}
      .l{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;fill:#2563eb}
      .g{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;fill:#c26a06}
    </style>
  </defs>

  <rect class="b" x="36" y="88" width="172" height="106" rx="10"/>
  <text class="t" x="122" y="116" text-anchor="middle">任务 A（发送方）</text>
  <text class="s" x="122" y="140" text-anchor="middle">持有发送权</text>
  <text class="s" x="122" y="162" text-anchor="middle">send right</text>

  <rect class="p" x="318" y="96" width="144" height="90" rx="12"/>
  <text class="t" x="390" y="124" text-anchor="middle">端口对象</text>
  <text class="s" x="390" y="146" text-anchor="middle">由内核维护</text>
  <text class="s" x="390" y="166" text-anchor="middle">消息队列在此</text>

  <rect class="b" x="552" y="88" width="172" height="106" rx="10"/>
  <text class="t" x="638" y="116" text-anchor="middle">任务 B（接收方）</text>
  <text class="s" x="638" y="140" text-anchor="middle">持有接收权</text>
  <text class="s" x="638" y="162" text-anchor="middle">receive right</text>

  <line x1="208" y1="128" x2="314" y2="132" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowM)"/>
  <text class="l" x="214" y="120">投递消息</text>

  <line x1="462" y1="140" x2="548" y2="136" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrowM)"/>
  <text class="l" x="478" y="128">取走消息</text>

  <rect class="n" x="36" y="228" width="172" height="56" rx="9"/>
  <text class="t" x="122" y="252" text-anchor="middle" font-size="12.5">无关任务</text>
  <text class="s" x="122" y="272" text-anchor="middle">没有任何权能</text>

  <line x1="208" y1="252" x2="300" y2="200" stroke="#cfd6e0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="238" y1="222" x2="262" y2="200" stroke="#c26a06" stroke-width="1.8"/>
  <line x1="262" y1="224" x2="238" y2="200" stroke="#c26a06" stroke-width="1.8"/>
  <text class="g" x="276" y="222">无法投递</text>

  <rect x="36" y="300" width="688" height="24" rx="6" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="50" y="316">拿到端口权能本身就是授权；服务端仍须在消息层校验调用者身份与参数。</text>
</svg>
