<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>06 对象模型与消息派发 · IOSBook</title><link rel="stylesheet" href="../style.css"></head><body><main class="content"><article class="hero"><header class="chapter-head"><span class="chapter-no">CHAPTER 06</span><h1>对象模型与消息派发</h1><p class="sub">用概念模型理解 Objective-C Runtime</p></header><p class="lead">Objective-C 的动态派发使对象行为不仅由静态类型决定。理解对象、类、方法元数据和消息查找之间的关系，是阅读运行时行为的基础。</p><h2>学习目标</h2><ul><li>区分对象实例、类对象、元类与方法描述信息。</li><li>理解消息发送与方法查找是运行时决策过程。</li><li>认识缓存、继承和动态特性对调试观察的影响。</li></ul><h2>验证练习</h2><p>在自己的小型 Objective-C 程序中定义继承关系和协议，比较静态声明、运行时类型信息与实际调用行为。</p><nav class="pager"><a href="../part/02-runtime.html">第二部目录</a><a href="./07-runtime-safety.html">下一章：运行时安全边界 →</a></nav></article></main></body></html>
