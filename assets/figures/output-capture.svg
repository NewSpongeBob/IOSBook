<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="实机输出的采集与记录流程">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="30" y="28">一条命令要变成证据，需要四步</text>

  <rect class="b" x="26" y="52" width="160" height="66" rx="8"/>
  <text class="t" x="40" y="78">运行命令</text>
  <text class="s" x="40" y="100">记录参数与环境</text>

  <rect class="b" x="212" y="52" width="160" height="66" rx="8"/>
  <text class="t" x="226" y="78">保存原始输出</text>
  <text class="s" x="226" y="100">不删减、不改写</text>

  <rect class="b" x="398" y="52" width="160" height="66" rx="8"/>
  <text class="t" x="412" y="78">标注平台</text>
  <text class="s" x="412" y="100">macOS / iOS / 架构</text>

  <rect class="g" x="584" y="52" width="150" height="66" rx="8"/>
  <text class="t" x="598" y="78">写读法</text>
  <text class="s" x="598" y="100">每条字段的含义</text>

  <line x1="186" y1="85" x2="208" y2="85" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="372" y1="85" x2="394" y2="85" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="558" y1="85" x2="580" y2="85" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>

  <text class="s" x="30" y="156">缺任何一步，输出就只是“看起来像证据”的截图：换台机器复现不了，也说不清字段含义。</text>
  <text class="s" x="30" y="178">平台必须写清：macOS 的二进制与 iOS 的二进制结构同源，但平台字段、签名与页大小不同。</text>
  <text class="s" x="30" y="200">实机输出只证明“这台机器上这条命令给出了这个结果”，不能外推成“iOS 一定如此”。</text>
</svg>
