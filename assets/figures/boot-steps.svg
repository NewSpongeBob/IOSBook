<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="启动链六步分帧">
  <defs>
    <style>
      .p{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .q{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.5px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
      .n{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#fff;font-weight:700}
    </style>
  </defs>

  <text class="h" x="30" y="26">启动链六步：每步只做一件事</text>

  <rect class="p" x="24" y="42" width="228" height="120" rx="9"/>
  <circle cx="46" cy="64" r="10" fill="#2563eb"/><text class="n" x="46" y="68" text-anchor="middle">1</text>
  <text class="t" x="64" y="68">上电：Boot ROM</text>
  <text class="s" x="40" y="92">固化代码先跑</text>
  <text class="s" x="40" y="112">只验下一级镜像的签名</text>
  <text class="s" x="40" y="136">失败 → 停恢复模式</text>

  <rect class="p" x="266" y="42" width="228" height="120" rx="9"/>
  <circle cx="288" cy="64" r="10" fill="#2563eb"/><text class="n" x="288" y="68" text-anchor="middle">2</text>
  <text class="t" x="306" y="68">引导：验内核缓存</text>
  <text class="s" x="282" y="92">验内核缓存与系统镜像</text>
  <text class="s" x="282" y="112">读启动策略与票据</text>
  <text class="s" x="282" y="136">失败 → 拒绝启动</text>

  <rect class="p" x="508" y="42" width="228" height="120" rx="9"/>
  <circle cx="530" cy="64" r="10" fill="#2563eb"/><text class="n" x="530" y="68" text-anchor="middle">3</text>
  <text class="t" x="548" y="68">安全隔区启动</text>
  <text class="s" x="524" y="92">独立处理器自检</text>
  <text class="s" x="524" y="112">用户密钥策略就位</text>
  <text class="s" x="524" y="136">失败 → 锁定功能不可用</text>

  <rect class="p" x="24" y="184" width="228" height="120" rx="9"/>
  <circle cx="46" cy="206" r="10" fill="#2563eb"/><text class="n" x="46" y="210" text-anchor="middle">4</text>
  <text class="t" x="64" y="210">内核初始化</text>
  <text class="s" x="40" y="234">地址空间、驱动、根卷</text>
  <text class="s" x="40" y="254">内核文本只读、指针签名</text>
  <text class="s" x="40" y="278">失败 → panic</text>

  <rect class="p" x="266" y="184" width="228" height="120" rx="9"/>
  <circle cx="288" cy="206" r="10" fill="#2563eb"/><text class="n" x="288" y="210" text-anchor="middle">5</text>
  <text class="t" x="306" y="210">launchd 起服务</text>
  <text class="s" x="282" y="234">按作业配置启动守护进程</text>
  <text class="s" x="282" y="254">每个进程套沙盒与签名策略</text>
  <text class="s" x="282" y="278">失败 → 功能缺失</text>

  <rect class="q" x="508" y="184" width="228" height="120" rx="9"/>
  <circle cx="530" cy="206" r="10" fill="#c26a06"/><text class="n" x="530" y="210" text-anchor="middle">6</text>
  <text class="t" x="548" y="210">首屏可用</text>
  <text class="s" x="524" y="234">主屏进程、渲染、数据库预热</text>
  <text class="s" x="524" y="254">用户看到的第一帧</text>
  <text class="s" x="524" y="278">这一段决定“开机快不快”</text>

  <text class="s" x="24" y="334">前三级在硬件与引导层，应用无法观测；第四级之后才有日志与诊断包可用。</text>
</svg>
