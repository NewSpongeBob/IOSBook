<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="跨语言边界的四种转换">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">边界上只有四种转换，任一没定清楚就会“能编译、跑不对”</text>

  <rect class="b" x="26" y="52" width="330" height="70" rx="8"/>
  <text class="t" x="40" y="76">类型可表示性</text>
  <text class="s" x="40" y="98">结构体/枚举/泛型 → 不透明对象，语义丢失</text>

  <rect class="b" x="404" y="52" width="330" height="70" rx="8"/>
  <text class="t" x="418" y="76">可空性</text>
  <text class="s" x="418" y="98">未标注 nullable → 隐式解包，运行时崩</text>

  <rect class="b" x="26" y="134" width="330" height="70" rx="8"/>
  <text class="t" x="40" y="158">错误桥接</text>
  <text class="s" x="40" y="180">throws ↔ NSError，失败可能被吞</text>

  <rect class="b" x="404" y="134" width="330" height="70" rx="8"/>
  <text class="t" x="418" y="158">所有权</text>
  <text class="s" x="418" y="180">delegate 弱引用 vs 闭包强捕获</text>

  <text class="s" x="30" y="238">稳定可观测的写法：需要被运行时观察的入口标 @objc dynamic；其余保持纯 Swift。</text>

</svg>
