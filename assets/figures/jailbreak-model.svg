<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="越狱改动的四条路径与现代保护">
  <defs>
    <marker id="arrowJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c26a06"/>
    </marker>
    <style>
      .l{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
      .r{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="40" y="28">原本的四条路径</text>
  <text class="h" x="420" y="28">越狱后</text>

  <rect class="l" x="40" y="46" width="240" height="44" rx="7"/>
  <text class="t" x="54" y="73">签名校验</text>
  <text class="s" x="140" y="73">只允许已签名映像</text>

  <rect class="l" x="40" y="100" width="240" height="44" rx="7"/>
  <text class="t" x="54" y="127">根文件系统</text>
  <text class="s" x="140" y="127">只读，根哈希封印</text>

  <rect class="l" x="40" y="154" width="240" height="44" rx="7"/>
  <text class="t" x="54" y="181">内核代码</text>
  <text class="s" x="140" y="181">文本只读，指针签名</text>

  <rect class="l" x="40" y="208" width="240" height="44" rx="7"/>
  <text class="t" x="54" y="235">加载链</text>
  <text class="s" x="140" y="235">只启动已签名服务</text>

  <rect class="r" x="420" y="46" width="290" height="44" rx="7"/>
  <text class="t" x="434" y="73">放行未签名库与可执行文件</text>

  <rect class="r" x="420" y="100" width="290" height="44" rx="7"/>
  <text class="t" x="434" y="127">可写或外挂 bootstrap 分区</text>

  <rect class="r" x="420" y="154" width="290" height="44" rx="7"/>
  <text class="t" x="434" y="181">改写判定函数或页表属性</text>

  <rect class="r" x="420" y="208" width="290" height="44" rx="7"/>
  <text class="t" x="434" y="235">注入或替换启动项</text>

  <line x1="284" y1="68" x2="416" y2="68" stroke="#c26a06" stroke-width="1.4" marker-end="url(#arrowJ)"/>
  <line x1="284" y1="122" x2="416" y2="122" stroke="#c26a06" stroke-width="1.4" marker-end="url(#arrowJ)"/>
  <line x1="284" y1="176" x2="416" y2="176" stroke="#c26a06" stroke-width="1.4" marker-end="url(#arrowJ)"/>
  <line x1="284" y1="230" x2="416" y2="230" stroke="#c26a06" stroke-width="1.4" marker-end="url(#arrowJ)"/>

  <rect x="40" y="272" width="670" height="48" rx="8" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="54" y="294">现代保护：内核文本只读（KTRR/PPPL）、系统卷封印（SSV）、指针认证（PAC）。</text>
  <text class="s" x="54" y="312">因此越狱必须“从漏洞进入”，而不是改一个配置开关。</text>
</svg>
