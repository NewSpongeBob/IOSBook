<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第五部 · 应用安全工程 · IOSBook</title><link rel="stylesheet" href="../style.css"></head><body><main class="content"><article class="hero"><p class="eyebrow">PART 05</p><h1>应用安全工程</h1><p class="sub">把安全工作从单点检测转为资产、信任边界、控制措施与回归验证的闭环。</p><h2>本部路线</h2><ol><li><a href="../ch/09-appsec.html">威胁建模与防护验证</a></li><li><a href="../ch/16-data-protection.html">密钥、凭据与数据保护</a></li><li><a href="../ch/17-network-security.html">网络安全与信任配置</a></li></ol><h2>核心原则</h2><ul><li>客户端检查是纵深防御信号，不能替代服务端授权。</li><li>敏感凭据采用平台提供的安全存储能力，并控制生命周期。</li><li>测试授权范围、数据处理和报告流程先于工具选择。</li></ul><p><a href="../index.html">← 返回首页</a></p></article></main></body></html>
