<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="实验记录的字段结构">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">一页记录：假设、环境、步骤、观察、结论、限制</text>

  <rect class="b" x="26" y="50" width="230" height="46" rx="6"/>
  <text class="s" x="40" y="78">假设：预期发生什么、为什么</text>

  <rect class="b" x="270" y="50" width="220" height="46" rx="6"/>
  <text class="s" x="284" y="78">环境：设备 / 版本 / 构建号</text>

  <rect class="b" x="504" y="50" width="234" height="46" rx="6"/>
  <text class="s" x="518" y="78">步骤：一次只改一个变量</text>

  <rect class="b" x="26" y="106" width="340" height="46" rx="6"/>
  <text class="s" x="40" y="134">观察：原始输出、日志片段、截图（脱敏）</text>

  <rect class="b" x="380" y="106" width="358" height="46" rx="6"/>
  <text class="s" x="394" y="134">结论：事实 / 推断 / 未知（分开列）</text>

  <rect class="y" x="26" y="162" width="712" height="54" rx="8"/>
  <text class="s" x="40" y="184">限制：本次结果不能推广到什么；下一步补测什么、谁负责。</text>
  <text class="s" x="40" y="204">没有“限制”一栏的记录，别人无法判断能不能复用。</text>

</svg>
