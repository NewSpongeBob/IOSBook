<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="从 exec 到 main 的加载流程与依赖来源">
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a8f68"/>
    </marker>
    <style>
      .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .d{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:13px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="25" y="34">加载顺序：先建依赖关系，再修正地址，最后运行初始化器</text>

  <rect class="b" x="25" y="60" width="122" height="72" rx="9"/>
  <text class="t" x="86" y="90" text-anchor="middle">exec</text>
  <text class="s" x="86" y="112" text-anchor="middle">内核装载主镜像</text>

  <rect class="b" x="172" y="60" width="122" height="72" rx="9"/>
  <text class="t" x="233" y="90" text-anchor="middle">依赖闭包</text>
  <text class="s" x="233" y="112" text-anchor="middle">dyld 解析依赖</text>

  <rect class="b" x="319" y="60" width="122" height="72" rx="9"/>
  <text class="t" x="380" y="90" text-anchor="middle">映射与修正</text>
  <text class="s" x="380" y="112" text-anchor="middle">重定位、绑定符号</text>

  <rect class="b" x="466" y="60" width="122" height="72" rx="9"/>
  <text class="t" x="527" y="90" text-anchor="middle">初始化器</text>
  <text class="s" x="527" y="112" text-anchor="middle">+load、静态构造</text>

  <rect class="b" x="613" y="60" width="122" height="72" rx="9"/>
  <text class="t" x="674" y="90" text-anchor="middle">main()</text>
  <text class="s" x="674" y="112" text-anchor="middle">进入应用代码</text>

  <line x1="147" y1="96" x2="170" y2="96" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="294" y1="96" x2="317" y2="96" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="441" y1="96" x2="464" y2="96" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="588" y1="96" x2="611" y2="96" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowD)"/>

  <rect class="d" x="105" y="186" width="118" height="44" rx="8"/>
  <text class="t" x="164" y="213" text-anchor="middle" font-size="12">libSystem</text>

  <rect class="d" x="243" y="186" width="118" height="44" rx="8"/>
  <text class="t" x="302" y="213" text-anchor="middle" font-size="12">内嵌框架</text>

  <rect class="d" x="381" y="186" width="150" height="44" rx="8"/>
  <text class="t" x="456" y="213" text-anchor="middle" font-size="12">共享缓存中的系统库</text>

  <line x1="164" y1="186" x2="205" y2="134" stroke="#0a8f68" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowU)"/>
  <line x1="302" y1="186" x2="262" y2="134" stroke="#0a8f68" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowU)"/>
  <line x1="456" y1="186" x2="330" y2="134" stroke="#0a8f68" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowU)"/>

  <text class="s" x="25" y="262">依赖解析失败会在启动阶段终止进程；初始化器阶段的失败看起来像“启动即退出”。</text>
</svg>
