<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="修复与回归的闭环">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">从“知道了”到“改好了并能证明”</text>

  <rect class="b" x="26" y="52" width="150" height="60" rx="8"/>
  <text class="t" x="40" y="76">最小复现</text>
  <text class="s" x="40" y="96">去掉无关步骤</text>

  <rect class="b" x="206" y="52" width="150" height="60" rx="8"/>
  <text class="t" x="220" y="76">根因</text>
  <text class="s" x="220" y="96">缺失的判断点</text>

  <rect class="b" x="386" y="52" width="150" height="60" rx="8"/>
  <text class="t" x="400" y="76">修权威端</text>
  <text class="s" x="400" y="96">服务端校验优先</text>

  <rect class="g" x="566" y="52" width="168" height="60" rx="8"/>
  <text class="t" x="580" y="76">补测试 + 复测</text>
  <text class="s" x="580" y="96">同环境、同数据规模</text>

  <line x1="176" y1="82" x2="202" y2="82" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="356" y1="82" x2="382" y2="82" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="536" y1="82" x2="562" y2="82" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>

  <text class="s" x="30" y="156">报告必须写：范围、复现步骤、证据（脱敏）、根因、修复、回归结果、残余风险。</text>
  <text class="s" x="30" y="178">完成标准：另一位开发者仅凭报告就能复现，并在修复后确认消失。</text>
  <text class="s" x="30" y="200">常见返工：只修客户端表现；用例写死数据 ID；复测环境与基线不同。</text>

</svg>
