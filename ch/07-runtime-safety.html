<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>07 运行时行为与安全边界 · IOSBook</title><link rel="stylesheet" href="../style.css"></head><body><main class="content"><article class="hero"><header class="chapter-head"><span class="chapter-no">CHAPTER 07</span><h1>运行时行为与安全边界</h1><p class="sub">动态特性、可观测性与稳健防御</p></header><p class="lead">动态派发、反射和模块化增加灵活性，也增加审计难度。安全设计应依赖稳健的授权和服务端校验，不应把客户端内的隐藏或单点检测当成信任根。</p><h2>学习目标</h2><ul><li>识别动态调用对代码可读性、测试覆盖和兼容性的影响。</li><li>理解客户端检测可以提供信号，但不能替代服务端授权。</li><li>为关键业务逻辑设计可审计、可回归的安全控制。</li></ul><h2>防御检查</h2><p>对自有应用梳理敏感操作的调用路径和授权依据；通过测试验证边界条件；把关键权限决策放在可信服务端。</p><nav class="pager"><a href="./06-objc.html">← 上一章</a><a href="../part/02-runtime.html">第二部目录</a><a href="../part/03-binary.html">第三部目录 →</a></nav></article></main></body></html>
