<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="按 cmdsize 逐条步进解析加载命令">
  <defs>
    <marker id="arrowLC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c32d0"/>
    </marker>
    <style>
      .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
      .c{fill:#f4f0fd;stroke:#d6c9f2;stroke-width:1.3}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.8px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
      .w{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
    </style>
  </defs>

  <text class="h" x="30" y="26">命令区不是定长数组：每条都带自己的长度</text>

  <rect class="b" x="26" y="44" width="190" height="76" rx="8"/>
  <text class="t" x="40" y="68">文件头</text>
  <text class="s" x="40" y="88">ncmds = 20</text>
  <text class="s" x="40" y="106">sizeofcmds = 1712</text>

  <rect class="c" x="246" y="44" width="110" height="76" rx="8"/>
  <text class="t" x="258" y="68">cmd 0</text>
  <text class="s" x="258" y="88">cmdsize 72</text>

  <rect class="c" x="376" y="44" width="110" height="76" rx="8"/>
  <text class="t" x="388" y="68">cmd 1</text>
  <text class="s" x="388" y="88">cmdsize 472</text>

  <rect class="c" x="506" y="44" width="110" height="76" rx="8"/>
  <text class="t" x="518" y="68">cmd 2</text>
  <text class="s" x="518" y="88">cmdsize 56</text>

  <rect class="c" x="636" y="44" width="96" height="76" rx="8"/>
  <text class="t" x="648" y="68">…</text>
  <text class="s" x="648" y="88">cmd 19</text>

  <line x1="216" y1="82" x2="242" y2="82" stroke="#6c32d0" stroke-width="1.4" marker-end="url(#arrowLC)"/>
  <line x1="356" y1="82" x2="372" y2="82" stroke="#6c32d0" stroke-width="1.4" marker-end="url(#arrowLC)"/>
  <line x1="486" y1="82" x2="502" y2="82" stroke="#6c32d0" stroke-width="1.4" marker-end="url(#arrowLC)"/>
  <line x1="616" y1="82" x2="632" y2="82" stroke="#6c32d0" stroke-width="1.4" marker-end="url(#arrowLC)"/>

  <text class="s" x="246" y="140">off += cmdsize（不是固定步长）</text>

  <rect x="26" y="164" width="706" height="120" rx="8" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="w" x="42" y="188">解析时必须校验</text>
  <text class="s" x="42" y="210">1. cmdsize ≥ 8，否则可能原地打转</text>
  <text class="s" x="42" y="230">2. off + cmdsize ≤ sizeofcmds，防止越界</text>
  <text class="s" x="42" y="250">3. 字符串字段是偏移引用，需二次校验范围</text>
  <text class="s" x="42" y="270">4. 命令条数与实际步进次数一致，否则文件被截断或伪造</text>

  <text class="s" x="26" y="306">任何来自文件的长度字段都按不可信输入处理；畸形文件应安全拒绝，而不是读出垃圾数据。</text>
</svg>
