<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="越狱改动与对应可观测证据">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.8px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">四处改动，各自留下不同层级的证据</text>

  <rect class="b" x="26" y="48" width="300" height="40" rx="6"/>
  <text class="s" x="40" y="73">签名校验被短路</text>
  <rect class="g" x="400" y="48" width="330" height="40" rx="6"/>
  <text class="s" x="414" y="73">能加载未签名库（行为级，高可靠）</text>

  <rect class="b" x="26" y="98" width="300" height="40" rx="6"/>
  <text class="s" x="40" y="123">根卷可写 / 外挂 bootstrap</text>
  <rect class="y" x="400" y="98" width="330" height="40" rx="6"/>
  <text class="s" x="414" y="123">特定目录可写（路径级，中）</text>

  <rect class="b" x="26" y="148" width="300" height="40" rx="6"/>
  <text class="s" x="40" y="173">内核补丁（页表/判定）</text>
  <rect class="y" x="400" y="148" width="330" height="40" rx="6"/>
  <text class="s" x="414" y="173">页权限异常、调试可用（中）</text>

  <rect class="b" x="26" y="198" width="300" height="40" rx="6"/>
  <text class="s" x="40" y="223">加载链被替换</text>
  <rect class="n" x="400" y="198" width="330" height="40" rx="6"/>
  <text class="s" x="414" y="223">额外守护进程（名字可伪装，低）</text>

  <line x1="330" y1="68" x2="396" y2="68" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="330" y1="118" x2="396" y2="118" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="330" y1="168" x2="396" y2="168" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="330" y1="218" x2="396" y2="218" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>

  <text class="s" x="30" y="272">检测顺序：先看行为级证据，再看路径；路径可改名，行为难伪造，但行为更容易误报。</text>

</svg>
