<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第六部 · 防护与兼容工程 · IOSBook</title><link rel="stylesheet" href="../style.css"></head><body><main class="content"><article class="hero"><p class="eyebrow">PART 06</p><h1>防护与兼容工程</h1><p class="sub">安全措施不是一次性开关，而是有威胁假设、失效模式、兼容矩阵和持续回归的工程控制。</p><h2>本部章节</h2><ol><li><a href="../ch/18-hardening.html">纵深防御与版本回归</a></li></ol><h2>交付检查</h2><ul><li>说明要保护的资产和控制措施针对的威胁。</li><li>覆盖支持的 OS、设备能力、网络状态与授权状态。</li><li>记录误报、可访问性和故障降级行为。</li><li>保持服务端为关键操作的最终授权方。</li></ul><p><a href="../index.html">← 返回首页</a></p></article></main></body></html>
