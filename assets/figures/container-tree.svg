<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="应用容器目录树与读写、备份属性">
  <defs>
    <style>
      .ro{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
      .rw{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.3}
      .tmp{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.3}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.8px;fill:#68727f}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
      .b{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.5px;fill:#c26a06}
    </style>
  </defs>

  <text class="h" x="30" y="26">能写的地方只有一处：数据容器；备份与清理规则各不相同</text>

  <rect class="ro" x="40" y="46" width="200" height="46" rx="7"/>
  <text class="t" x="54" y="66">YourApp.app</text>
  <text class="s" x="54" y="82">只读；随包，不参与备份</text>

  <rect class="rw" x="300" y="46" width="420" height="230" rx="10"/>
  <text class="t" x="316" y="68">Data（可写容器）</text>

  <rect x="318" y="80" width="384" height="40" rx="6" fill="#fff" stroke="#d7dee9"/>
  <text class="t" x="332" y="105" font-size="11.5">Documents/</text>
  <text class="s" x="440" y="105">用户数据</text>
  <text class="b" x="600" y="105">参与备份</text>

  <rect x="318" y="128" width="384" height="40" rx="6" fill="#fff" stroke="#d7dee9"/>
  <text class="t" x="332" y="153" font-size="11.5">Library/Application Support/</text>
  <text class="s" x="600" y="153">可选排除</text>

  <rect x="318" y="176" width="384" height="40" rx="6" fill="#fff" stroke="#d7dee9"/>
  <text class="t" x="332" y="201" font-size="11.5">Library/Caches/</text>
  <text class="s" x="560" y="201">可被清理</text>
  <text class="b" x="650" y="201">不备份</text>

  <rect class="tmp" x="318" y="224" width="384" height="40" rx="6"/>
  <text class="t" x="332" y="249" font-size="11.5">tmp/</text>
  <text class="s" x="420" y="249">临时文件，不保证保留</text>

  <rect class="tmp" x="40" y="128" width="200" height="84" rx="7"/>
  <text class="t" x="54" y="150">App Group 容器</text>
  <text class="s" x="54" y="170">签名含该组才能访问</text>
  <text class="s" x="54" y="188">主应用与扩展共享</text>

  <rect class="ro" x="40" y="232" width="200" height="60" rx="7"/>
  <text class="t" x="54" y="254">钥匙串</text>
  <text class="s" x="54" y="274">与文件系统分离，卸载可能保留</text>

  <text class="s" x="30" y="306">缓存目录可能被系统清理，不能当唯一数据源；退出登录要清理数据库、缓存与钥匙串条目。</text>
  <text class="s" x="30" y="324">包内不可写，所以“下载资源到应用目录”实际落在 Data 容器里。</text>
</svg>
