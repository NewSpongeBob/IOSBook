<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="ARM64 调用约定与栈帧布局">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .reg{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.3}
      .fr{fill:#f7f9fd;stroke:#c9d6ea;stroke-width:1.3}
      .hi{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.5}
      .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:13px;fill:#1c2533;font-weight:600}
      .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;fill:#475467}
      .l{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;fill:#2563eb}
      .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
    </style>
  </defs>

  <text class="h" x="30" y="28">参数与返回值</text>
  <text class="h" x="410" y="28">栈帧（向下增长）</text>

  <rect class="reg" x="30" y="42" width="330" height="44" rx="7"/>
  <text class="t" x="44" y="69">x0 – x7</text>
  <text class="s" x="130" y="69">前八个整型/指针参数；x0 兼作返回值</text>

  <rect class="reg" x="30" y="94" width="330" height="44" rx="7"/>
  <text class="t" x="44" y="121">x8</text>
  <text class="s" x="130" y="121">间接返回结果地址（大结构体）</text>

  <rect class="reg" x="30" y="146" width="330" height="44" rx="7"/>
  <text class="t" x="44" y="173">x19 – x28</text>
  <text class="s" x="130" y="173">被调用者保存，返回前必须恢复</text>

  <rect class="reg" x="30" y="198" width="330" height="44" rx="7"/>
  <text class="t" x="44" y="225">x29 / x30</text>
  <text class="s" x="130" y="225">帧指针 / 返回地址</text>

  <rect class="reg" x="30" y="250" width="330" height="44" rx="7"/>
  <text class="t" x="44" y="277">sp</text>
  <text class="s" x="130" y="277">栈指针，16 字节对齐</text>

  <rect class="fr" x="410" y="42" width="320" height="64" rx="7"/>
  <text class="t" x="426" y="68">调用方栈帧</text>
  <text class="s" x="426" y="90">高地址；bl 之前已存在</text>

  <rect class="hi" x="410" y="116" width="320" height="64" rx="7"/>
  <text class="t" x="426" y="142">保存的 x29 与 x30</text>
  <text class="s" x="426" y="164">stp x29, x30, [sp, #-0x20]!</text>

  <rect class="fr" x="410" y="190" width="320" height="64" rx="7"/>
  <text class="t" x="426" y="216">局部变量与临时空间</text>
  <text class="s" x="426" y="238">按需分配，大小由序言决定</text>

  <line x1="410" y1="274" x2="740" y2="274" stroke="#c26a06" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="s" x="410" y="292">sp（进入函数后）</text>

  <line x1="360" y1="220" x2="404" y2="148" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowA)"/>
  <text class="l" x="300" y="246">x29 指向帧底</text>

  <line x1="360" y1="272" x2="404" y2="224" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowA)"/>
  <text class="l" x="330" y="302">sp 指向栈顶</text>

  <rect x="30" y="330" width="700" height="52" rx="8" fill="#fff9ec" stroke="#f0d9a8"/>
  <text class="s" x="46" y="352">Objective-C 方法另有约定：x0 = 接收者，x1 = 选择子，其余参数从 x2 开始；</text>
  <text class="s" x="46" y="372">返回对象指针仍在 x0，因此判断“是否为空”通常看 x0 上的 cbz/cbnz。</text>
</svg>
