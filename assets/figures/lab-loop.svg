<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="靶场评估的四阶段闭环">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">四天一个闭环：定范围 → 建基线 → 验证 → 修复回归</text>

  <rect class="b" x="30" y="56" width="160" height="66" rx="8"/>
  <text class="t" x="44" y="82">定范围</text>
  <text class="s" x="44" y="104">对象、授权、禁止项</text>

  <rect class="b" x="216" y="56" width="160" height="66" rx="8"/>
  <text class="t" x="230" y="82">建基线</text>
  <text class="s" x="230" y="104">构建号、数据流</text>

  <rect class="b" x="402" y="56" width="160" height="66" rx="8"/>
  <text class="t" x="416" y="82">验证</text>
  <text class="s" x="416" y="104">存储、网络、授权</text>

  <rect class="g" x="588" y="56" width="150" height="66" rx="8"/>
  <text class="t" x="602" y="82">修复回归</text>
  <text class="s" x="602" y="104">报告与残余风险</text>

  <line x1="190" y1="89" x2="212" y2="89" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="376" y1="89" x2="398" y2="89" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="562" y1="89" x2="584" y2="89" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar)"/>

  <path d="M660,126 C660,180 110,180 110,126" fill="none" stroke="#0a8f68" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text class="s" x="340" y="196">复盘后回到范围：补用例、缩范围或换对象</text>

  <text class="s" x="30" y="238">停止条件：触及他人数据、非自有服务或超出授权范围时立即停止。</text>

</svg>
