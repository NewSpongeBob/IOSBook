<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>08 Mach-O 与虚拟地址空间 · IOSBook</title><link rel="stylesheet" href="../style.css"></head><body><main class="content"><article class="hero"><header class="chapter-head"><span class="chapter-no">CHAPTER 08</span><h1>Mach-O 与虚拟地址空间</h1><p class="sub">可执行文件结构、映射与地址随机化的基础概念</p></header><p class="lead">Mach-O 描述可执行文件及其组成。离线文件偏移、虚拟地址和进程运行时地址是不同概念，分析时必须明确所处坐标系。</p><h2>学习目标</h2><ul><li>认识 Mach-O 文件头、加载命令与段/节的组织方式。</li><li>区分文件偏移、首选虚拟地址与运行时映射地址。</li><li>理解 ASLR 的防御目的及其对调试和崩溃分析的影响。</li></ul><h2>安全实践</h2><p>使用 Apple 官方开发工具检查自己构建的二进制，比较构建设置和符号信息；发布前检查调试信息、依赖来源与构建可追溯性。</p><nav class="pager"><a href="../part/03-binary.html">第三部目录</a><a href="../part/04-appsec.html">第四部目录 →</a></nav></article></main></body></html>
