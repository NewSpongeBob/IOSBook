      <h1>02 xnu / Mach / Darwin 基础</h1>
      <p>xnu 是 iOS 的核心内核，来自 Mach 微内核与 BSD 组件的结合。理解它，就等于理解 iOS 的基础调度、进程、IPC 和内存模型。</p>
      <p><b>核心概念：</b>进程、线程、task、mach port、VM、VFS、syscall。</p>
