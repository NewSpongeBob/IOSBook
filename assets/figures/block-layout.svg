<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Block 的内存布局与捕获变量">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><style>
  .b{fill:#eef3fb;stroke:#c9d6ea;stroke-width:1.4}
  .g{fill:#effaf5;stroke:#a9dcc9;stroke-width:1.4}
  .y{fill:#fff9ec;stroke:#f0d9a8;stroke-width:1.4}
  .n{fill:#f2f4f7;stroke:#cfd6e0;stroke-width:1.3}
  .t{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#1c2533;font-weight:600}
  .s{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#68727f}
  .h{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12.5px;fill:#2563eb}
  .k{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;fill:#c26a06}
</style></defs>

  <text class="h" x="30" y="28">头部固定 32 字节，捕获变量跟在后面</text>

  <rect class="b" x="60" y="56" width="110" height="54" rx="6"/>
  <text class="t" x="70" y="78" font-size="12">isa</text>
  <text class="s" x="70" y="98">8 字节</text>

  <rect class="b" x="178" y="56" width="110" height="54" rx="6"/>
  <text class="t" x="188" y="78" font-size="12">flags</text>
  <text class="s" x="188" y="98">4 字节</text>

  <rect class="b" x="296" y="56" width="110" height="54" rx="6"/>
  <text class="t" x="306" y="78" font-size="12">reserved</text>
  <text class="s" x="306" y="98">4 字节</text>

  <rect class="b" x="414" y="56" width="110" height="54" rx="6"/>
  <text class="t" x="424" y="78" font-size="12">invoke</text>
  <text class="s" x="424" y="98">8 字节</text>

  <rect class="b" x="532" y="56" width="140" height="54" rx="6"/>
  <text class="t" x="542" y="78" font-size="12">descriptor</text>
  <text class="s" x="542" y="98">8 字节：大小/拷贝/销毁</text>

  <rect class="y" x="60" y="124" width="612" height="54" rx="6"/>
  <text class="t" x="74" y="146">捕获变量区（按需）</text>
  <text class="s" x="74" y="166">值捕获是拷贝；__block 变成转发结构；对象默认强引用</text>

  <rect class="g" x="60" y="196" width="200" height="54" rx="6"/>
  <text class="t" x="74" y="218">全局 block</text>
  <text class="s" x="74" y="238">不捕获变量</text>

  <rect class="g" x="272" y="196" width="200" height="54" rx="6"/>
  <text class="t" x="286" y="218">栈 block</text>
  <text class="s" x="286" y="238">返回后失效</text>

  <rect class="g" x="484" y="196" width="188" height="54" rx="6"/>
  <text class="t" x="498" y="218">堆 block</text>
  <text class="s" x="498" y="238">被拷贝，需配对释放</text>

</svg>
